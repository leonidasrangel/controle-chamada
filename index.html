<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Sistema de controle de chamada e gestao escolar" />
  <meta name="color-scheme" content="light dark" />
  <title>Controle de Chamada</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./assets/styles/base.css" />
  <link rel="stylesheet" href="./assets/styles/components.css" />
  <link rel="stylesheet" href="./assets/styles/layout.css" />

  <!--
    Aplica o tema salvo antes da primeira pintura para evitar "flash" de tela clara
    em usuarios de dark mode. Precisa ser inline e sincrono.
  -->
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('cc.theme');
        const theme = saved ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch { /* localStorage indisponivel (modo privado): mantem o padrao */ }
    })();
  </script>
</head>
<body>
  <div id="app" class="app-shell"></div>

  <!-- Camadas sobrepostas, fora do fluxo do app para evitar stacking context preso -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
